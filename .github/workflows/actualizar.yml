name: Actualizar titulares de Sin Ruido
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/actualizar.py'
      - 'scripts/mapas_publicos.py'
      - 'scripts/test_recopilacion.py'
      - 'scripts/clasificar.py'
      - 'scripts/acceso.py'
      - 'scripts/editorial.py'
      - 'scripts/test_portada.js'
      - 'docs/politica.js'
      - 'docs/fuentes.json'
  schedule:
    - cron: '7,37 * * * *'
# Evitar que una ejecución retrasada choque con otra al subir noticias.json.
concurrency:
  group: sinruido-rss-edition
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  noticias:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validar reglas de clasificación
        run: python scripts/clasificar.py
      - name: Validar identificación de artículos de pago
        run: python scripts/acceso.py
      - name: Validar criterio editorial de portadas
        run: python scripts/editorial.py
      - name: Comprobar filtros de todos los lectores y orden de hoy
        run: node scripts/test_portada.js
      - name: Probar equilibrio de cabeceras y sitemaps sin red
        run: python scripts/test_recopilacion.py
      - name: Obtener titulares RSS
        run: python scripts/actualizar.py
      - name: Guardar noticias públicas
        run: |
          git config user.name "Sin Ruido Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/noticias.json
          if ! git diff --cached --quiet; then
            git commit -m "Actualización automática de titulares"
            # Mientras se recogen RSS puede cambiar index.html u otro archivo
            # en main. Rebasar primero evita rechazos por referencia desfasada.
            for attempt in 1 2 3; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then
                echo "Edición RSS publicada correctamente"
                exit 0
              fi
              echo "El repositorio avanzó durante el envío. Reintento $attempt/3."
              sleep 2
            done
            echo "No se ha podido publicar la edición tras tres intentos." >&2
            exit 1
          fi
