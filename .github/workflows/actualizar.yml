name: Actualizar titulares de Sin Ruido
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/actualizar.py'
      - 'scripts/version_app.py'
      - 'docs/index.html'
      - 'docs/*.css'
      - 'docs/*.js'
      - 'docs/*.webmanifest'
      - 'docs/*.png'
      - 'docs/*.svg'
      - 'docs/suscripciones.json'
      - '.github/workflows/actualizar.yml'
      - 'scripts/mapas_publicos.py'
      - 'scripts/test_recopilacion.py'
      - 'scripts/clasificar.py'
      - 'scripts/acceso.py'
      - 'scripts/editorial.py'
      - 'scripts/test_portada.js'
      - 'docs/politica.js'
      - 'docs/fuentes.json'
  schedule:
    - cron: '7,37 * * * *'
# Evitar que una ejecución retrasada choque con otra al subir noticias.json.
concurrency:
  group: sinruido-rss-edition
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  noticias:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validar reglas de clasificación
        run: python scripts/clasificar.py
      - name: Validar identificación de artículos de pago
        run: python scripts/acceso.py
      - name: Validar criterio editorial de portadas
        run: python scripts/editorial.py
      - name: Comprobar filtros de todos los lectores y orden de hoy
        run: node scripts/test_portada.js
      - name: Probar equilibrio de cabeceras y sitemaps sin red
        run: python scripts/test_recopilacion.py
      - name: Obtener titulares RSS
        run: python scripts/actualizar.py
      - name: Guardar noticias públicas
        run: |
          set -e
          git config user.name "Sin Ruido Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Mantener la edición ya generada, aunque main cambie mientras
          # recogemos RSS. No rebasar un commit que contiene otro noticias.json.
          candidate="$(mktemp)"
          cp docs/noticias.json "$candidate"
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            # Nunca sobrescribir una edición más nueva ni regresar a otra
            # versión de la aplicación si una ejecución previa se adelantó.
            if python - "$candidate" docs/noticias.json <<'PY'
          import datetime as dt, json, sys
          def read(path):
              try:
                  with open(path,encoding="utf-8") as f:return json.load(f)
              except (OSError,ValueError):return {}
          new,old=read(sys.argv[1]),read(sys.argv[2])
          try:
              new_date=dt.datetime.fromisoformat(new["updated"])
              old_date=dt.datetime.fromisoformat(old["updated"])
          except (KeyError,ValueError,TypeError):
              sys.exit(0)
          if old_date >= new_date:
              print("Ya existe una edición más reciente. No se sobrescribe.")
              sys.exit(1)
          PY
            then
              cp "$candidate" docs/noticias.json
            else
              exit 0
            fi
            git add docs/noticias.json
            if git diff --cached --quiet; then
              echo "La edición pública ya está actualizada."
              exit 0
            fi
            git commit -m "Actualización automática de titulares"
            if git push origin HEAD:main; then
              echo "Edición RSS publicada correctamente"
              exit 0
            fi
            echo "Main cambió durante el envío; reintento $attempt/3."
            sleep 2
          done
          echo "No se pudo publicar la edición tras tres intentos." >&2
          exit 1
