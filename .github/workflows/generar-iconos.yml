name: Generar iconos de Sin Ruido
on:
  workflow_dispatch:
  push:
    paths:
      - 'docs/icon.svg'
      - '.github/workflows/generar-iconos.yml'
permissions:
  contents: write
jobs:
  crear_iconos:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar conversor SVG gratuito
        run: python -m pip install --disable-pip-version-check cairosvg
      - name: Convertir icono a PNG de iPhone y Android
        run: |
          python - <<'PY'
          import cairosvg
          for name, size in [("apple-touch-icon.png",180),("icon-192.png",192),("icon-512.png",512)]:
              cairosvg.svg2png(url="docs/icon.svg",write_to="docs/"+name,output_width=size,output_height=size)
              print("Creado:",name,size)
          PY
      - name: Publicar iconos en GitHub Pages
        run: |
          git config user.name "Sin Ruido Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/apple-touch-icon.png docs/icon-192.png docs/icon-512.png
          if ! git diff --cached --quiet; then
            git commit -m "Generar iconos PNG oficiales de Sin Ruido"
            git push
          fi
